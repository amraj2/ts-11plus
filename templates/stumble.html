<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b2bd6">
  <title>Spark Stumble - Tiny Spark</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b2bd6'/%3E%3Crect x='20' y='12' width='24' height='38' rx='12' fill='%23ffc233'/%3E%3Ccircle cx='27' cy='26' r='4' fill='white'/%3E%3Ccircle cx='38' cy='26' r='4' fill='white'/%3E%3C/svg%3E">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tiny Spark">
  <link rel="stylesheet" href="{{ static_v('stumble.css') }}">
</head>
<body>
  <!-- LOBBY -->
  <section id="lobby" class="screen">
    <a class="back" href="{{ url_for('index') }}">&larr; Practice mode</a> <a class="back" href="{{ url_for('privacy') }}" style="float:right">Privacy</a>
    <div class="lobby-grid">
      <div class="lobby-main">
        <div class="logo">Spark<br>Stumble</div>
        <p class="tagline">32 players. 3 rounds. Answer the gates, beat the crowd, win the crown!</p>
        <div id="dailyBonus" class="daily" hidden></div>
        <button class="btn btn-go" id="playBtn">PLAY</button>
        <div class="chips">
          <div class="chip"><b id="crownCount">0</b><span>👑 crowns</span></div>
          <div class="chip"><b id="coinCount">0</b><span>🪙 coins</span></div>
          <div class="chip"><b id="bestRank">–</b><span>best finish</span></div>
        </div>
        <div class="level"><span id="levelLabel">Level 1</span><div class="level-bar"><div id="levelFill"></div></div></div>
      </div>
      <div class="lobby-side">
        <canvas id="preview" width="220" height="220" aria-label="Your bean"></canvas>
        <div class="name-row">
          <select id="nameA" aria-label="Nickname first word"></select>
          <select id="nameB" aria-label="Nickname second word"></select>
        </div>
        <h3>Colour</h3><div class="swatches" id="swatches"></div>
        <h3>Hats</h3><div class="hats" id="hats"></div>
        <div class="toggles">
          <label><input type="checkbox" id="soundToggle" checked> Sound</label>
          <label><input type="checkbox" id="relaxedToggle"> Relaxed mode (extra thinking time)</label>
        </div>
      </div>
    </div>
  </section>

  <!-- FINDING PLAYERS -->
  <section id="finding" class="screen center" hidden>
    <div class="finding-card">
      <h2>Finding players…</h2>
      <div class="finding-count"><b id="findCount">1</b> / 32</div>
      <div class="finding-bar"><div id="findFill"></div></div>
      <p id="findName" class="finding-name"></p>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen game" hidden>
    <canvas id="stage"></canvas>
    <div class="hud">
      <div class="hud-top">
        <div class="pill" id="hudRound">Qualifier</div>
        <div class="pill pill-hot" id="hudSlots">20 to qualify</div>
        <div class="pill" id="hudRank">1st</div>
        <div class="pill pill-fire" id="hudStreak" hidden>🔥 x2</div>
        <button class="icon-btn" id="muteBtn" aria-label="Toggle sound">🔊</button>
      <button class="icon-btn" id="quitBtn" aria-label="Leave race" style="margin-left:0">✕</button>
      </div>
      <div class="minimap" id="minimap" aria-hidden="true"><div class="mm-track"></div></div>
      <div class="ticker" id="ticker" aria-live="polite"></div>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-head"><span class="subject" id="sheetSubject"></span><span id="sheetGate"></span></div>
      <div class="timer"><div id="timerFill"></div></div>
      <div class="q-scroll">
        <div class="q-text" id="qText"></div>
        <div class="q-opts" id="qOpts"></div>
      </div>
    </div>
  </section>

  <!-- ROUND RESULTS -->
  <section id="results" class="screen center" hidden>
    <div class="results-card">
      <div class="results-title" id="resTitle"></div>
      <p id="resSub" class="results-sub"></p>
      <ol id="resList" class="standings"></ol>
      <div class="rewards" id="resRewards"></div>
      <button class="btn btn-go" id="resNext">Next</button>
    </div>
  </section>

  <!-- RUN SUMMARY -->
  <section id="summary" class="screen center" hidden>
    <div class="summary-card">
      <div class="results-title" id="sumTitle"></div>
      <div class="sum-grid" id="sumGrid"></div>
      <h3 id="mistakeHead">Let's learn from these</h3>
      <div id="mistakes" class="mistakes"></div>
      <div class="sum-actions">
        <button class="btn btn-go" id="againBtn">Play again</button>
        <button class="btn btn-ghost" id="lobbyBtn">Lobby</button>
      </div>
    </div>
  </section>

  <script src="{{ url_for('questions_js', v=bank_version) }}"></script>
  <script src="{{ static_v('stumble.js') }}" defer></script>
  <script src="{{ static_v('pwa.js') }}" defer></script>
</body>
</html>
